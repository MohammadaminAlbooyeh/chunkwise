[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunkwise"
version = "0.1.0"
description = "Text chunking for RAG with reversible offsets — every chunk is an exact slice of the source document."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Amin Albooyeh", email = "amin.albooyeh@gmail.com" },
]
keywords = ["rag", "chunking", "nlp", "embeddings", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
semantic = ["numpy"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/amin-albooyeh/chunkwise"
Repository = "https://github.com/amin-albooyeh/chunkwise"
Documentation = "https://github.com/amin-albooyeh/chunkwise/tree/main/docs"
Changelog = "https://github.com/amin-albooyeh/chunkwise/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/chunkwise"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["chunkwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
